# Horizon Pulse — Fly.io SPIKE skeleton (prep only).
# No deploy from this file until Michael creates the Fly account and Pulse is cleared to run.
# Do not put secrets here. Documented required secret NAMES only (values via `fly secrets set`).

app = "horizon-pulse-spike"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret defaults only. Override at deploy time if needed.
  NODE_ENV = "production"
  X402_NETWORK = "base"
  # Required secret NAMES (set with `fly secrets set`, never commit values):
  #   CDP_API_KEY_ID
  #   CDP_API_KEY_SECRET
  # Optional / usually set as secrets or env (names only):
  #   PAY_TO
  #   BASE_RPC_URL
  #   ETH_RPC_URL

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
