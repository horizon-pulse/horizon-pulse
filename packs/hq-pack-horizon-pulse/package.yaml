name: hq-pack-horizon-pulse
version: 0.1.0
publisher: '@horizon-pulse'
access: public
description: 'Connects the hosted Horizon Pulse MCP server (https://horizonpulse.dev/mcp) to HQ: pay-per-call tools for web search, web fetch, PDF to text, page screenshots, an HTTP proxy, structured page extract, x402 endpoint checks, CDP Bazaar index checks and crypto market data. Paid tools return an x402 payment request (USDC on Base) instead of a result until the call is paid. No API key or signup.'
requires:
  hqCore: '>=15.0.0'
  # Runtime prerequisites:
  #   - Network access to https://horizonpulse.dev/mcp (MCP Streamable HTTP).
  #   - Node/npx on PATH: the MCP entry bridges the remote server with mcp-remote,
  #     per HQ's mcp-transport-detection policy (the server answers 406 to a
  #     JSON-only Accept header).
  #   - To get results rather than payment requests: an x402-capable MCP client
  #     and a dedicated low-balance Base USDC wallet (see knowledge/horizon-pulse).
contributes:
  skills:
    - horizon-pulse
  knowledge:
    - horizon-pulse
  mcp:
    - horizon-pulse
keywords:
  - hq
  - hq-pack
  - mcp
  - x402
  - web-search
  - crypto-market-data
repository: https://github.com/horizon-pulse/horizon-pulse
